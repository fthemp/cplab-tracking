# CPLab Tracking - Mosquitto 2.x configuration (laptop broker)
# Windows : C:\Program Files\mosquitto\mosquitto.conf  -> restart the "Mosquitto Broker" service
# Linux   : /etc/mosquitto/conf.d/cplab.conf           -> sudo systemctl restart mosquitto
# macOS   : /opt/homebrew/etc/mosquitto/mosquitto.conf -> brew services restart mosquitto

per_listener_settings false

# MQTT for the Tab5 and Node-RED
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets for the web supervision site
listener 9001 0.0.0.0
protocol websockets

# Lab network: anonymous access. For a protected setup:
#   mosquitto_passwd -c passwd cplab   then replace the line below by
#   allow_anonymous false
#   password_file <path>/passwd
allow_anonymous true

# keep retained messages (counts, OF, stats) across broker restarts
persistence true
autosave_interval 60

# Outage handling (spec v4, bloc 3). Node-RED connects with a persistent session
# (client id "cplab-nodered", clean session off): while it is reconnecting, the
# broker keeps its messages instead of dropping them, including QoS 0 ones, which
# is what the Tab5 (PubSubClient) publish.
persistent_client_expiration 1d
max_queued_messages 1000
queue_qos0_messages true
